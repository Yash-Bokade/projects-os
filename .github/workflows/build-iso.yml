# ==========================================================================
#  Builds the portable NixOS ISO on every push, saves it as a workflow
#  artifact, and attaches it to a GitHub Release when you push a tag
#  (git tag v1.0 && git push --tags).
#
#  The ISO also builds fine locally:  nix build .#iso
# ==========================================================================
name: Build Portable NixOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write # needed to attach the ISO to a Release

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the nix closure + squashfs work need more room than the runner
      # has by default
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true
          sudo docker image prune --force || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # optional: comment in and set your CACHIX_CACHE for much faster
      # rebuilds after the first run
      # - uses: cachix/cachix-action@v16
      #   with:
      #     name: your-cache
      #     authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build the ISO
        run: |
          nix build .#iso --print-build-logs --fallback
          ls -lh result/iso/
          cp -v result/iso/*.iso portable-nixos-x86_64-linux.iso
          sha256sum portable-nixos-x86_64-linux.iso > portable-nixos-x86_64-linux.iso.sha256
          echo "### ISO ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $(du -h portable-nixos-x86_64-linux.iso | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          cat portable-nixos-x86_64-linux.iso.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-nixos-iso
          path: |
            portable-nixos-x86_64-linux.iso
            portable-nixos-x86_64-linux.iso.sha256
          retention-days: 30
          compression-level: 0 # the ISO is already compressed inside

      - name: Attach ISO to GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portable-nixos-x86_64-linux.iso
            portable-nixos-x86_64-linux.iso.sha256
          generate_release_notes: true
