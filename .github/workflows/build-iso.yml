name: Build & Release Projects OS ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'os/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h

      - name: Build Projects OS (Compile C Binaries + Archiso)
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash /workspace/os/build.sh

      - name: Verify ISO size, checksums & handle GitHub 2 GiB asset limit
        run: |
          ls -lh out/
          mkdir -p release-assets
          ISO_FILE=$(ls out/projects-os-*.iso | head -n 1)
          mv "$ISO_FILE" out/projects-os-x86_64.iso
          (cd out && sha256sum projects-os-x86_64.iso > ../release-assets/SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

          ISO_BYTES=$(stat -c%s out/projects-os-x86_64.iso)
          echo "Final ISO size: ${ISO_BYTES} bytes"

          # GitHub Releases hard limit is 2,147,483,648 bytes (2 GiB) per asset.
          # Upload single ISO directly if under 2 GiB; otherwise split cleanly into 1900 MiB parts.
          if (( ISO_BYTES < 2147483648 )); then
            mv out/projects-os-x86_64.iso release-assets/projects-os-x86_64.iso
            echo "UPLOAD_MODE=single" >> "$GITHUB_ENV"
          else
            echo "ISO exceeds 2 GiB (${ISO_BYTES} bytes); splitting into 1900 MiB release parts..."
            split -b 1900M -d -a 2 out/projects-os-x86_64.iso release-assets/projects-os-x86_64.iso.part
            (cd release-assets && sha256sum projects-os-x86_64.iso.part* >> SHA256SUMS.txt)
            echo "UPLOAD_MODE=split" >> "$GITHUB_ENV"
          fi
          ls -lh release-assets/

      - name: Create Release Tag & Publish ISO
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}-${{ github.run_id }}
          name: Projects OS Build #${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Projects OS (Zero-Python Portable Arch Linux — Hyprland + Niri)

            - **100% Native C (GTK4) + Pure Shell** — Zero Python runtime bloat.
            - **Auto 15 GB Persistence** on 32 GB USB drives flashed via Rufus (**DD Image mode**).

            ### Flash Instructions (Windows + Rufus)
            1. Download `projects-os-x86_64.iso` below (if split into `.part00`/`.part01`, run `copy /b projects-os-x86_64.iso.part* projects-os-x86_64.iso` in Command Prompt first).
            2. Open **Rufus**, select your **32 GB USB drive**, and choose `projects-os-x86_64.iso`.
            3. Click **START** and choose **Write in DD Image mode**.
            4. Boot from USB (Secure Boot disabled).

            ### Default Credentials
            - **User**: `dev`
            - **Password**: `projects` (also `sudo` password)
          files: |
            release-assets/*
