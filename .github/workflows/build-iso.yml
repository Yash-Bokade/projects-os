name: build-iso

# Builds the live ISO, splits it into <2 GiB parts (GitHub's per-file release limit),
# and publishes the parts + checksums as a GitHub Release.
#
#   * push a tag:      git tag v0.1.0 && git push origin v0.1.0
#   * or run manually: Actions -> build-iso -> Run workflow (enter a tag name)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The ISO build needs a lot of disk; a stock runner has too little free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
          large-packages: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      - name: Work out the release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Lock flake inputs (if flake.lock is not committed)
        run: |
          if [ ! -f flake.lock ]; then nix flake lock; fi

      - name: Build the ISO
        run: nix build .#iso --print-build-logs --out-link result

      - name: Split into release parts and write checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          iso="$(ls result/iso/*.iso)"
          name="portable-nixos-${TAG}.iso"
          mkdir -p out

          # 1900 MiB < 2 GiB, the GitHub release asset limit.
          split -b 1900M -d -a 3 --numeric-suffixes=1 "$iso" "out/${name}."

          sha256sum "$iso" | awk -v n="$name" '{print $1 "  " n}' > out/SHA256SUMS
          (cd out && sha256sum "${name}".0* >> SHA256SUMS)

          ls -lh out
          du -h "$iso"

          {
            echo "# portable-nixos ${TAG}"
            echo
            echo "Live ISO split into $(ls out/${name}.0* | wc -l) parts (GitHub limits release files to 2 GiB)."
            echo
            echo "## 1. Download every \`${name}.00N\` file and \`SHA256SUMS\`"
            echo
            echo "## 2. Join the parts"
            echo
            echo "Linux / macOS:"
            echo '```sh'
            echo "cat ${name}.0* > ${name}"
            echo '```'
            echo
            echo "Windows (cmd), list the parts in order:"
            echo '```bat'
            printf 'copy /b '
            ls out/${name}.0* | xargs -n1 basename | paste -sd+ | tr -d '\n'
            echo " ${name}"
            echo '```'
            echo "Or with 7-Zip: right-click the first part -> 7-Zip -> Combine files."
            echo
            echo "## 3. Verify"
            echo '```sh'
            echo "sha256sum -c --ignore-missing SHA256SUMS   # Linux"
            echo '```'
            echo "Windows: \`certutil -hashfile ${name} SHA256\` and compare with the line in SHA256SUMS."
            echo
            echo "## 4. Write it to a USB stick or SD card"
            echo "Use **dd**, balenaEtcher, or Rufus in **DD Image mode**. Do not use Ventoy: persistence needs the image written directly."
            echo '```sh'
            echo "sudo dd if=${name} of=/dev/sdX bs=4M status=progress conv=fsync   # replace /dev/sdX!"
            echo '```'
            echo
            echo "## 5. Boot it"
            echo "Pick the stick in your firmware's boot menu (UEFI). You are logged in automatically."
            echo "On first boot, free space on the stick becomes the persistent \`/home\` (needs 2 GiB+ free, so use a stick larger than the image)."
            echo "Initial password: see \`vars.nix\` (default \`portable\`)."
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: portable-nixos ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          files: out/*
          fail_on_unmatched_files: true
