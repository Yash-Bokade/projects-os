# ==========================================================================
#  nomad — screensaver / lock screen (swaylock-effects)
#
#  Massive time and date, mono, NixOS-blue key highlight.
#  Runs automatically after 7 min idle (niri config -> swayidle) and on
#  demand with Mod+Alt+L.
# ==========================================================================

# show the clock even before any keypress
indicator

# don't validate empty enter-presses
ignore-empty-password
show-failed-attempts

# the massive clock
clock
timestr=%H:%M
datestr=%a, %d %b

font=JetBrains Mono
font-size=110

# theme: near-black field, light text, blue only where keys are pressed
text-color=EDEDED
color=0E0E10
inside-color=0E0E10
ring-color=33333A
line-color=0E0E10
separator-color=0E0E10
key-hl-color=5277C3
bs-hl-color=6E6E78
