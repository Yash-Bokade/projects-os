# ==========================================================================
#  nomad — ghostty terminal config
#  transparent background, grayscale ANSI ramp, NixOS-blue cursor
# ==========================================================================

font-family = JetBrains Mono
font-size = 11

# transparency — the reason this terminal was chosen
background-opacity = 0.88

# base colors (mono)
background = #101014
foreground = #EDEDED

# the one accent
cursor-color = #5277C3
cursor-text = #0E0E10

# selection stays gray
selection-background = #2E2E38
selection-foreground = #EDEDED

# grayscale ANSI palette (mono aesthetic — the UI chrome carries the blue)
palette = 0=#1C1C21
palette = 1=#6E6E78
palette = 2=#84848E
palette = 3=#9A9AA4
palette = 4=#B0B0B9
palette = 5=#C4C4CC
palette = 6=#D8D8DE
palette = 7=#EDEDED
palette = 8=#33333B
palette = 9=#9A9AA4
palette = 10=#AEAEb8
palette = 11=#C4C4CC
palette = 12=#D4D4DC
palette = 13=#E0E0E6
palette = 14=#ECECF0
palette = 15=#F7F7F9

# comfort
window-padding-x = 12
window-padding-y = 12
mouse-hide-while-typing = true
copy-on-select = clipboard
confirm-close-surface = false
window-theme = dark
